services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile.dev
    container_name: super8_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - FAMILLE_PASSWORD=${FAMILLE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./app:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy
    networks:
      - super8_net

  db:
    image: mysql:8.0
    container_name: super8_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - super8_net

  videos:
    image: nginx:alpine
    container_name: super8_videos
    restart: unless-stopped
    volumes:
      - ./videos:/usr/share/nginx/html/videos:ro
      - ./nginx/videos.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - super8_net

volumes:
  db_data:

networks:
  super8_net:
    driver: bridge
